<!-- PapaParse CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        let venueChartInstance = null;
        let statusChartInstance = null;

        // URL Publikasi CSV dari Google Sheets kamu
        const rawCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS5lT9nqQFaO2f0Hl3WtpIL5Vq35tmHMmuCeHOuNbv2B33t3UPk11ysHKoiiKaSnsGuBHtTi5fh6zdR/pub?gid=1416043534&single=true&output=csv';
        
        // Membungkus URL menggunakan Proxy AllOrigins agar Lolos CORS di protokol file://
        const targetUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawCsvUrl + '&_ts=' + new Date().getTime());

        async function fetchSpreadsheetData() {
            try {
                document.getElementById('dataStatus').innerText = "Sedang Mengambil Data...";
                
                const response = await fetch(targetUrl);
                
                if (!response.ok) {
                    throw new Error('Gagal terhubung ke endpoint');
                }

                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            processRawData(results.data);
                        } else {
                            document.getElementById('dataStatus').innerText = "Data Kosong di Sheet2";
                        }
                    }
                });
            } catch (error) {
                console.error("Error Detail:", error);
                // Fallback: Jika Proxy gagal, coba fetch langsung
                tryDirectFetch();
            }
        }

        async function tryDirectFetch() {
            try {
                const res = await fetch(rawCsvUrl + '&_ts=' + new Date().getTime());
                const text = await res.text();
                Papa.parse(text, {
                    header: false,
                    skipEmptyLines: true,
                    complete: (res) => processRawData(res.data)
                });
            } catch (err) {
                document.getElementById('dataStatus').innerText = "Akses Diblokir Browser (Gunakan Live Server / Web Hosting)";
            }
        }

        function processRawData(rows) {
            let venueMap = {};
            let totalKebutuhan = 0, totalInputOrder = 0, totalOgp = 0, totalCancel = 0, totalDone = 0;

            const headers = rows[0].map(h => String(h).replace(/"/g, '').trim().toUpperCase());
            
            let idxVenue = headers.findIndex(h => h.includes('VENUE') || h.includes('LOKASI'));
            let idxStatus = headers.findIndex(h => h.includes('STATUS') || h.includes('PROGRESS') || h.includes('KET'));
            let idxInput = headers.findIndex(h => h.includes('INPUT') || h.includes('ORDER'));
            let idxOgp = headers.findIndex(h => h.includes('OGP') || h.includes('ON GOING'));
            let idxCancel = headers.findIndex(h => h.includes('CANCEL') || h.includes('BATAL'));
            let idxDone = headers.findIndex(h => h.includes('DONE') || h.includes('SELESAI'));

            if (idxVenue === -1) idxVenue = 0;
            if (idxStatus === -1) idxStatus = 1;

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;

                const venueVal = row[idxVenue] ? String(row[idxVenue]).replace(/"/g, '').trim() : '';
                if (!venueVal || venueVal.toUpperCase() === 'TOTAL' || venueVal.toUpperCase().includes('TOTAL ALL') || venueVal.toUpperCase() === 'VENUE') continue;

                const venueName = venueVal.toUpperCase();

                if (!venueMap[venueName]) {
                    venueMap[venueName] = { inputOrder: 0, ogp: 0, cancel: 0, done: 0, total: 0 };
                }

                const valInput = idxInput !== -1 ? parseInt(row[idxInput]) || 0 : 0;
                const valOgp = idxOgp !== -1 ? parseInt(row[idxOgp]) || 0 : 0;
                const valCancel = idxCancel !== -1 ? parseInt(row[idxCancel]) || 0 : 0;
                const valDone = idxDone !== -1 ? parseInt(row[idxDone]) || 0 : 0;

                if (valInput || valOgp || valCancel || valDone) {
                    venueMap[venueName].inputOrder += valInput;
                    venueMap[venueName].ogp += valOgp;
                    venueMap[venueName].cancel += valCancel;
                    venueMap[venueName].done += valDone;
                    venueMap[venueName].total += (valInput + valOgp + valCancel + valDone);
                } else {
                    const statusVal = row[idxStatus] ? String(row[idxStatus]).replace(/"/g, '').trim().toUpperCase() : '';
                    if (statusVal.includes('DONE') || statusVal.includes('SELESAI')) {
                        venueMap[venueName].done++;
                    } else if (statusVal.includes('OGP') || statusVal.includes('ON GOING') || statusVal.includes('PROGRESS')) {
                        venueMap[venueName].ogp++;
                    } else if (statusVal.includes('CANCEL') || statusVal.includes('BATAL')) {
                        venueMap[venueName].cancel++;
                    } else {
                        venueMap[venueName].inputOrder++;
                    }
                    venueMap[venueName].total++;
                }
            }

            let tableHtml = '';
            let venueList = [];

            Object.keys(venueMap).forEach(vName => {
                const v = venueMap[vName];
                const ach = v.total > 0 ? ((v.done / v.total) * 100).toFixed(2) : "0.00";
                const badgeClass = parseFloat(ach) > 0 ? 'badge-achievement' : 'badge-zero';

                totalKebutuhan += v.total;
                totalInputOrder += v.inputOrder;
                totalOgp += v.ogp;
                totalCancel += v.cancel;
                totalDone += v.done;

                venueList.push({ name: vName, total: v.total });

                tableHtml += `
                    <tr>
                        <td><strong>${vName}</strong></td>
                        <td style="text-align: center; font-weight:700;">${v.total}</td>
                        <td style="text-align: center;">${v.inputOrder}</td>
                        <td style="text-align: center; color: #38bdf8;">${v.ogp}</td>
                        <td style="text-align: center; color: #f43f5e;">${v.cancel}</td>
                        <td style="text-align: center; color: #34d399;">${v.done}</td>
                        <td style="text-align: right;"><span class="${badgeClass}">${ach}%</span></td>
                    </tr>
                `;
            });

            document.getElementById('tableBody').innerHTML = tableHtml || `<tr><td colspan="7" style="text-align:center;">Data kosong di Sheet2</td></tr>`;

            const totalAch = totalKebutuhan > 0 ? ((totalDone / totalKebutuhan) * 100).toFixed(2) : "0.00";
            document.getElementById('footTotal').innerText = totalKebutuhan;
            document.getElementById('footInputOrder').innerText = totalInputOrder;
            document.getElementById('footOgp').innerText = totalOgp;
            document.getElementById('footCancel').innerText = totalCancel;
            document.getElementById('footDone').innerText = totalDone;
            document.getElementById('footAch').innerText = `${totalAch}%`;

            const venueCount = Object.keys(venueMap).length;
            const inputOrderPercent = totalKebutuhan > 0 ? ((totalInputOrder / totalKebutuhan) * 100).toFixed(2) : "0.00";

            document.getElementById('kpiTotal').innerText = totalKebutuhan;
            document.getElementById('kpiVenueCount').innerText = `${venueCount} Venue Utama`;

            document.getElementById('kpiAch').innerText = `${totalAch}%`;
            document.getElementById('kpiDoneSub').innerText = `${totalDone} Selesai`;

            document.getElementById('kpiInputOrder').innerText = totalInputOrder;
            document.getElementById('kpiInputOrderSub').innerText = `${inputOrderPercent}% Antrean`;

            document.getElementById('kpiOgp').innerText = totalOgp;
            document.getElementById('kpiCancel').innerText = totalCancel;

            document.getElementById('dataStatus').innerText = `Data Source: Live Sheet2 (${totalKebutuhan} Items)`;

            venueList.sort((a, b) => b.total - a.total);
            const top5Venues = venueList.slice(0, 5);

            renderCharts(
                top5Venues.map(x => x.name),
                top5Venues.map(x => x.total),
                [totalInputOrder, totalDone, totalOgp, totalCancel]
            );
        }

        function renderCharts(venueLabels, venueValues, statusData) {
            const ctx1 = document.getElementById('venueChart').getContext('2d');
            if (venueChartInstance) venueChartInstance.destroy();
            venueChartInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: venueLabels,
                    datasets: [{
                        label: 'Jumlah Layanan',
                        data: venueValues,
                        backgroundColor: ['#e11d48', '#0284c7', '#f59e0b', '#84cc16', '#8b5cf6'],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } },
                        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#334155' } }
                    }
                }
            });

            const ctx2 = document.getElementById('statusChart').getContext('2d');
            if (statusChartInstance) statusChartInstance.destroy();
            statusChartInstance = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: [
                        `Input Order (${statusData[0]})`, 
                        `Done (${statusData[1]})`, 
                        `OGP (${statusData[2]})`, 
                        `Cancel (${statusData[3]})`
                    ],
                    datasets: [{
                        data: statusData,
                        backgroundColor: ['#f59e0b', '#10b981', '#38bdf8', '#e11d48'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#f8fafc', font: { size: 11 } }
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', fetchSpreadsheetData);
    </script>
